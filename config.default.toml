# pdfterm configuration. Created on first launch; existing files are never overwritten.
# Default location: ~/.config/pdfterm/config.toml.
# XDG_CONFIG_HOME overrides ~/.config. Restart viewer/editor after editing.

fit_mode = "page"                  # page, width, or height
dark_mode = false                  # Invert PDF colors using the selected theme
theme = ""                         # Empty: built-in palette; otherwise a theme TOML path
theme_catalog = ""                 # Empty: no external catalog; otherwise a catalog TOML path
persistent_link_picker = false     # Keep link browser open after following a link
link_picker_split_percent = 50     # Link pane size, 20–80 percent
link_picker_layout = "auto"         # auto, vertical, horizontal, or floating
synctex_enabled = true              # Enable Option/Alt-click PDF-to-source jumps
nvim_socket = "/tmp/pdfterm-nvim.sock"       # Empty disables editor delivery (clipboard remains)
forward_socket = "/tmp/pdfterm-forward.sock" # Empty disables source-to-PDF requests

[viewer]
continuous_scroll = true           # Display adjacent pages together; false restores page-at-a-time
smooth_scroll = true               # Animate vertical wheel/j/k movement in continuous mode
scroll_frame_ms = 16               # Minimum interval between animation frames, 1–1000 ms
scroll_ease_divisor = 4            # Fraction of remaining distance per frame, 1–100 (1 = instant)
scroll_step_percent = 12           # Small vertical movement as viewport percent, 1–100
page_scroll_percent = 85           # Large vertical movement as viewport percent, 1–100
set_window_title = true            # Set terminal/window title to active PDF filename
center_forward_search = true       # Center SyncTeX box; false aligns its top near viewport top
flash_duration_ms = 1000            # Highlight lifetime, 1–60000 ms
word_precision = true              # Refine inverse search with nearby PDF/source words
source_context_lines = 4           # Maximum source lines before/after SyncTeX result, 0–100

[nvim]
viewer = "terminal"                # terminal (Kitty/Ghostty split) or skim (macOS displayline)
compile = false                    # Run latexmk before forward search
focus_on_inverse = true            # Focus the captured source terminal after inverse search
executable = ""                    # Empty: target/release/pdfterm beside bundled plugin; or absolute path

[nvim.keys]
forward = "<leader>cl"              # Save and forward-search (optionally compile)
build = "<leader>cb"                # Build main TeX file (TeX buffers only)
main_file = "<leader>csl"           # Use current TeX file as main document
compile = "<leader>cscl"            # Toggle compilation before forward search
skim = "<leader>csls"               # Select Skim viewer
terminal = "<leader>cslt"           # Select pdfterm viewer
